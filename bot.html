      ["ملحوظة: لو في ريحة غاز دلوقتي — اقفل المحبس وافتح الشبابيك وكلم 129 الأول قبل الفني.",
      ],
    ],
    contact: [
      [{h:true,t:"أرقامنا الرسمية من موقع الشركة:"}],
      [{t:"طوارئ الغاز: 129 — لأي تسريب أو حالة خطرة."}],
      [{t:"المقر الرئيسي / خدمة العملاء: 0223494789."}],
      [{t:"العنوان: قطعة 7-8 الحي الأول، مركز خدمات الحي الأول، مدينة بدر، محافظة القاهرة."}],
      [{t:"الموقع الرسمي: moderngas.com.eg — فيه صفحات إجراءات التعاقد وأرقام خدمة العملاء."}],
      ["كل منطقة في مناطق الامتياز ليها خط خدمة عملاء متخصص — ابعتلي اسم منطقتك وهوجهلك الرقم.",
      ],
    ],
    location: [
      [{h:true,t:"المقر الرئيسي لمودرن جاز:"}],
      [{t:"قطعة 7-8 الحي الأول، مركز خدمات الحي الأول، مدينة بدر، محافظة القاهرة."}],
      [{h:true,t:"تنويه مهم لعملاء بدر:"}],
      [{t:"فرع خدمة عملاء بدر اتنقل للموقع الجديد — (عمارة 103) المجاورة الرابعة، الحي الأول، شارع سعد زغلول، الدور الأرضي."}],
      ["مواعيد العمل: السبت للخميس من 8 الصبح لـ 4 العصر، والجمعة عطلة.",
      ],
    ],
    hours: [
      [{h:true,t:"مواعيد العمل الرسمية:"}],
      [{t:"السبت للخميس: من 8 الصبح لحد الساعة 4 العصر."}],
      [{t:"الجمعة: عطلة."}],
      [{t:"طوارئ الغاز (129): شغالة في كل الأوقات لحالات التسريب والخطورة."}],
    ],
    vision: [
      [{h:true,t:"رؤية مودرن جاز في سطور:"}],
      [{t:"الرؤية: إحداث نقلات نوعية في عمليات توصيل الغاز الطبيعي حسب المعايير القومية للجودة والاعتماد، والريادة بين شركات التوصيل."}],
      [{t:"الرسالة: أهمية قصوى لرأس المال البشري، وتحسين بيئة العمل ورفع رضا العاملين."}],
      [{t:"القيم: رضا العملاء، العمل الجماعي، التميز التشغيلي، الجودة، المسؤولية، والطموح."}],
    ],
    chairman: [
      [{h:true,t:"رئيس مجلس الإدارة والعضو المنتدب في مودرن جاز:"}],
      [{t:"المهندس وائل جويد."}],
      [{t:"وهو اللي بيترأس وفود الشركة في مشروعات التوسع في توصيل الغاز الطبيعي بالمحافظات، وفي متابعة محطات تخفيض الضغط خلال الأعياد."}],
    ],
    cylinders: [
      [{h:true,t:"توضيح مهم مني كممثل مودرن جاز:"}],
      [{t:"مودرن جاز شركة توصيل وتوزيع الغاز الطبيعي — بنوصل الغاز الطبيعي للبيوت والشركات، ومش بنبيع أسطوانات بوتاجاز أو أجهزة طهي."}],
      [{t:"أسطوانات البوتاجاز مسؤولة منها جهات تانية برة منظومة توصيل الغاز الطبيعي."}],
      ["لو حابب توصيل غاز طبيعي لبيتك أو محلك، أنا معاك في التعاقد والخطوات.",
      ],
    ],
    thanks: "العفو! سعدت بخدمتك. لو في أي حاجة تخص مودرن جاز — تعاقد، عداد، شحن، فواتير، سلامة، أو أرقام تواصل — أنا معاك في أي وقت.",
    fallback: [
      [{h:true,t:"أنا مساعد «مودرن جاز» الشخصي."}],
      [{t:"كلامي وردودي جوه خدمات الشركة وإرشاداتها بس: تعاقد على الغاز الطبيعي، العداد والشحن والقراءة، الفواتير، السلامة، وأرقام التواصل."}],
      ["أي سؤال برة اللي يخص مودرن جاز مش هقدر أرد عليه — بس لو سؤالك عن الغاز الطبيعي أو من خدماتنا، أعيد صياغته وأنا في خدمتك.",
      ],
    ],
  };
  const GKEYS = ["greeting","about","coverage","contract","meters","payment","safety","emergency","leak","contact","location","hours","vision","chairman","thanks","cylinders"];
  const PHRASES = [
    ["emergency", ["حريق","نار","لهب","طوارئ"]],
    ["leak", ["تسريب","ريحه","غاز معفن"]],
    ["e01", ["e-01","e01"]],
    ["book", ["زياره فني","استدعي فني","حجز فني","فني العداد","احجز فني"]],
    ["cylinders", ["بوتاجاز","بونين","اسطوانه"]],
    ["contract", ["انتداب","تعاقد","اشتراك غاز"]],
    ["hours", ["مواعيد","دوام"]],
    ["location", ["عنوان","فرع","بدر"]],
    ["contact", ["الرقم","تليفون","واتساب","الخط الساخن"]],
    ["chairman", ["وائل جويد","رئيس الشركه"]],
    ["vision", ["الرساله","الرؤيه","رساله"]],
    ["safety", ["سلامه","نصايح","قواعد الامان"]],
  ];
  function unal(s) {
    return s.split(" ").map(function (t) {
      return (t.length > 2 && t.indexOf("ال") === 0) ? t.slice(2) : t;
    }).join(" ");
  }
  function detect(q, raw) {
    var q2 = unal(q);
    for (var i = 0; i < PHRASES.length; i++) {
      var p = PHRASES[i];
      if (p[0] === "e01" && /e-?01/i.test(raw)) return "e01";
      for (var j = 0; j < p[1].length; j++) {
        var al = p[1][j];
        if (q.indexOf(al) !== -1 || q2.indexOf(al) !== -1) return p[0];
      }
    }
    var best = null, cn = null, bestScore = 0, bestPos = 1e9;
    for (var g = 0; g < G.length; g++) {
      var words = G[g], m = 0, pos = 1e9;
      for (var w = 0; w < words.length; w++) {
        var kw = words[w];
        var k = q.indexOf(kw);
        if (k === -1) k = q2.indexOf(kw);
        if (k !== -1) { m++; if (k < pos) pos = k; }
      }
      var name = GKEYS[g];
      if (m > bestScore || (m === bestScore && m > 0 && pos < bestPos)) {
        best = name; bestScore = m; bestPos = pos;
      }
    }
    if (bestScore > 0) return best;
    /* منطقة من مناطق الامتياز؟ */
    var qN = q.replace(/\s/g, "");
    for (var rg in REGIONS) {
      if (REGIONS.hasOwnProperty(rg) && qN.indexOf(rg) !== -1) return "coverage";
    }
    return "fallback";
  }
  const chipSet = ["عن مودرن جاز","تعاقد على الغاز","رسالة E-01","شحن كارت العداد","الفواتير والدفع","ريحة غاز / طوارئ","أرقام التواصل","العنوان والمواعيد"];
  const CHIP_ICONS = {
    "عن مودرن جاز": "i-building",
    "تعاقد على الغاز": "i-doc",
    "رسالة E-01": "i-chip",
    "شحن كارت العداد": "i-card",
    "الفواتير والدفع": "i-wallet",
    "ريحة غاز / طوارئ": "i-alert",
    "أرقام التواصل": "i-phone",
    "العنوان والمواعيد": "i-clock"
  };
  /* ═══════ حالة التفكير (نص فقط — من غير صوت) ═══════ */
  function setThinking(on){
    chatEl.classList.toggle("thinking", on);
    if (on) status("بيفكر ويدور على الإجابة...");
    else status(defOnline);
  }
  function scrollBottom() { area.scrollTop = area.scrollHeight; }
  function userBubble(text) {
    var d = document.createElement("div");
    d.className = "msg user";
    d.textContent = text;
    area.appendChild(d);
    scrollBottom();
  }
  function botBubble(content) {
    var d = document.createElement("div");
    d.className = "msg bot";
    var lines = typeof content === "string" ? [content] : content;
    for (var i = 0; i < lines.length; i++) {
      var item = lines[i];
      if (typeof item === "string") {
        var ln = document.createElement("div");
        ln.className = "line";
        ln.textContent = item;
        d.appendChild(ln);
      } else {
        for (var k = 0; k < item.length; k++) {
          var o = item[k];
          if (o.h) {
            var hl = document.createElement("div");
            hl.className = "line h";
            hl.textContent = o.t;
            d.appendChild(hl);
          } else {
            var bl = document.createElement("div");
            bl.className = "bullet";
            var sp = document.createElement("span");
            sp.textContent = o.t;
            bl.appendChild(sp);
            d.appendChild(bl);
          }
        }
      }
    }
    area.appendChild(d);
    scrollBottom();
  }
  /* فقاعة الرد بتتحدث أثناء استقبال الكلام (ستريمينج) */
  function streamBubble() {
    var d = document.createElement("div");
    d.className = "msg bot";
    d.style.whiteSpace = "pre-wrap";
    d.style.wordBreak = "break-word";
    area.appendChild(d);
    scrollBottom();
    return {
      update: function (txt) {
        d.textContent = txt;
        scrollBottom();
      },
      finalize: function (txt) { d.textContent = txt; scrollBottom(); },
      el: d
    };
  }
  function typing(cb) {
    var t = document.createElement("div");
    t.className = "typing";
    for (var i = 0; i < 3; i++) { var s = document.createElement("span"); t.appendChild(s); }
    area.appendChild(t);
    scrollBottom();
    setThinking(true);
    setTimeout(function () { t.remove(); setThinking(false); cb(); }, 700 + Math.random() * 500);
  }
  function showThinking() {
    var t = document.createElement("div");
    t.className = "typing";
    for (var i = 0; i < 3; i++) { var s = document.createElement("span"); t.appendChild(s); }
    area.appendChild(t);
    scrollBottom();
    setThinking(true);
    return t;
  }
  function hideThinking(el) {
    if (el && el.parentNode) el.remove();
    setThinking(false);
  }
  function renderChips() {
    chipsEl.innerHTML = "";
    for (var i = 0; i < chipSet.length; i++) {
      (function (txt, idx) {
        var c = document.createElement("button");
        c.className = "chip";
        c.style.animationDelay = (idx * 45) + "ms";
        var icon = CHIP_ICONS[txt];
        if (icon) {
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "chip-ico");
          svg.setAttribute("aria-hidden", "true");
          var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
          use.setAttribute("href", "#" + icon);
          svg.appendChild(use);
          c.appendChild(svg);
        }
        var sp = document.createElement("span");
        sp.textContent = txt;
        c.appendChild(sp);
        c.addEventListener("click", function () { handle(txt); });
        chipsEl.appendChild(c);
      })(chipSet[i], i);
    }
  }
  async function handle(text) {
    var raw = (text || "").trim();
    if (!raw) return;
    userBubble(raw);
    inp.value = "";
    pushConv("user", raw);
    /* 1) السيرفر المحلي (بدون أي مفاتيح أو رابط خارجي) */
    if (window.location.protocol !== "file:") {
      status("بيرد دلوقتي...");
      var tt = showThinking();
      try {
        var resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: raw, history: CONV.slice(-10) })
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        hideThinking(tt);
        var sb = streamBubble();
        var reader = resp.body.getReader();
        var dec = new TextDecoder();
        var full = "";
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          /* مهم: نضيفraw ونتجنّب trim جوّه اللوب — الـtrim بيبتلع المسافة
             في آخر chunk فتلزق الكلمات ببعض. الـtrim للعرض بس. */
          var delta = dec.decode(r.value, { stream: true });
          full += delta;
          sb.update(full.trim());
        }
        dec.decode();
        full = full.trim();
        if (!full.trim()) full = "عذراً، حدث خطأ. حاول مرة أخرى.";
        sb.finalize(full);
        pushConv("assistant", full);
        renderChips();
        return;
      } catch (e) {
        console.error("server error:", e);
        hideThinking(tt);
        status("السيرفر مش شغال — الرد من البيانات المحلية...");
      }
    }
    /* 2) المحرك المحلي — داتا الأسئلة أولاً ثم الكلمات المفتاحية */
    typing(function () {
      var qaAnswer = matchQA(raw);
      if (qaAnswer) {
        pushConv("assistant", qaAnswer);
        botBubble(qaAnswer);
        renderChips();
        return;
      }
      var key = detect(N(raw), raw);
      var content = R[key] ? R[key] : R.fallback;
      var flat = flatten(content);
      pushConv("assistant", flat);
      botBubble(content);
      renderChips();
    });
  }
  /* ═══════ تحويل الرد لنص مسطّح (بدون أي صوت) ═══════ */
  function flatten(content) {
    var parts = [];
    if (typeof content === "string") { parts.push(content); }
    else {
      for (var i = 0; i < content.length; i++) {
        var item = content[i];
        if (typeof item === "string") { parts.push(item); }
        else { for (var k = 0; k < item.length; k++) { parts.push(item[k].t); } }
      }
    }
    return parts.join("، ");
  }
  sendBtn.addEventListener("click", function () { handle(inp.value); });
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") handle(inp.value); });
  clearBtn.addEventListener("click", function () {
    CONV = [];
    area.innerHTML = "";
    renderChips();
    status(defOnline);
  });
  area.innerHTML = "";
  renderChips();
  inp.focus();
})();
</script>
