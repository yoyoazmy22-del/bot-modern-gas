<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modern Gas × AI — المساعد الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{--ink:#eaf5fc;--muted:#a9c2d4;--teal:#2dd4bf;--teald:#0e8f86;--flame:#fb923c;--flamed:#ea580c;--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Cairo",system-ui,sans-serif;color:var(--ink);
 background:radial-gradient(1100px 700px at 85% -5%,#114a6e 0%,transparent 55%),
  radial-gradient(900px 700px at 5% 110%,#b4530966 0%,transparent 55%),
  linear-gradient(165deg,#081c31,#0a2a46 55%,#0e3a55);
 display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;pointer-events:none}
.brand-name{font-weight:900;letter-spacing:.14em;font-size:15px}
.brand-chip{background:linear-gradient(135deg,var(--flame),var(--flamed));color:#0b1520;font-weight:900;font-size:12px;padding:3px 9px;border-radius:999px}
.brand-sub-sm{font-size:12px;font-weight:700;color:var(--muted)}
.clear{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.clear:hover{color:var(--ink);background:rgba(255,255,255,.12)}
.api-url{width:170px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;outline:none;transition:.2s;text-align:right;direction:ltr}
.api-url:focus{border-color:rgba(45,212,191,.6);color:var(--ink);width:260px;background:rgba(255,255,255,.1)}
.api-url::placeholder{color:#5a7a8e;font-weight:600;font-size:11px}
.gk{width:150px;background:rgba(251,146,60,.07);border:1px solid rgba(251,146,60,.4);color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;padding:6px 10px;border-radius:999px;outline:none;transition:.2s;direction:ltr}
.gk:focus{border-color:var(--flame);color:var(--ink);width:230px;background:rgba(251,146,60,.13)}
.gk::placeholder{color:#7d5a3a;font-weight:600;font-size:11px}
.chat{width:min(780px,96vw);flex:1;display:flex;flex-direction:column;background:rgba(7,23,39,.55);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.chat-head{display:flex;align-items:center;gap:14px;padding:8px 14px;background:linear-gradient(135deg,#0baa8f,#08786c)}
.chat-head strong{font-size:15px;line-height:1.2}
.online{display:block;font-size:11px;color:#c8fdf3;font-weight:600}
.voice-select{background:rgba(6,30,44,.6);border:1px solid rgba(255,255,255,.25);color:#d9fff8;font-family:inherit;font-size:12px;font-weight:600;padding:6px 8px;border-radius:9px;outline:none;cursor:pointer;max-width:170px}
.voice-select:focus{border-color:#8ff5e6}
.voice-select option{background:#0b3a4d;color:#f2fffc}
.chat.speaking .online{animation:stt .6s ease infinite alternate}
@keyframes stt{from{opacity:.55}to{opacity:1}}
/* ═══ avatar: رجل AI ═══ */
.ava-ai{width:94px;height:104px;flex:0 0 auto;position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.ava-ai svg{width:100%;height:100%;display:block}
.ava-ai .glow{transform-box:fill-box;transform-origin:center}
.chat.speaking .ava-ai .glow{animation:glowp 1s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.22;transform:scale(.96)}50%{opacity:.55;transform:scale(1.05)}}
.ava-ai .headg{transform-box:fill-box;transform-origin:50% 42%}
.chat.speaking .ava-ai .headg{animation:headbob .55s ease-in-out infinite}
.chat.thinking .ava-ai .headg{animation:headtilt 1.1s ease-in-out infinite alternate}
@keyframes headbob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(2.5px) rotate(1.6deg)}}
@keyframes headtilt{from{transform:rotate(0deg)}to{transform:rotate(-4deg) translateY(1px)}}
.ava-ai .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,92.5%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.wave{position:absolute;bottom:16px;right:-10px;display:flex;gap:2.5px;align-items:flex-end;height:16px;pointer-events:none}
.wave i{width:3.5px;height:5px;background:#bdfbf0;border-radius:3px;opacity:.45}
.chat.speaking .wave i{animation:wave .72s ease-in-out infinite}
.chat.speaking .wave i:nth-child(1){animation-delay:0s}
.chat.speaking .wave i:nth-child(2){animation-delay:.15s}
.chat.speaking .wave i:nth-child(3){animation-delay:.3s}
.chat.speaking .wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{height:4px;opacity:.4}50%{height:15px;opacity:1}}
.ava-ai .ant{transform-box:fill-box;transform-origin:center}
.chat.speaking .ava-ai .ant{animation:antp 1s ease-in-out infinite}
@keyframes antp{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.thinking-bub{position:absolute;top:-12px;left:-6px;background:#1c3c53;color:#9fc7de;font-weight:900;font-size:13px;border-radius:12px;padding:2px 10px;letter-spacing:2px;display:none;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.chat.thinking .thinking-bub{display:block}
.chat.thinking .thinking-bub span{animation:tp 1.2s infinite}
.chat.thinking .thinking-bub span:nth-child(2){animation-delay:.15s}
.chat.thinking .thinking-bub span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.35}30%{opacity:1}}
.msg-area{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:12px;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:20px 20px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.msg{max-width:78%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.75;font-weight:600;white-space:pre-line;animation:pop .3s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.bot{align-self:flex-start;background:#1c3c53;color:#e9f6ff;border-start-start-radius:5px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#0eab8f,#0a7f6a);color:#eafff9;border-start-end-radius:5px}
.msg .line{padding:1px 0}
.msg .h{font-weight:900;color:#8ff5e6}
.bullet{display:flex;gap:8px;align-items:flex-start}
.bullet::before{content:"◆";color:var(--flame);font-size:11px;margin-top:8px}
.msg.alt .bullet::before{color:var(--teal)}
.typing{display:flex;gap:4px;align-self:flex-start;padding:12px 15px;background:#1c3c53;border-radius:16px;border-start-start-radius:5px}
.typing span{width:7px;height:7px;border-radius:50%;background:#9fc7de;animation:tp 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px 4px}
.chip{background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.45);color:#bdfbf0;font-family:inherit;font-size:12.5px;font-weight:700;border-radius:999px;padding:7px 13px;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(45,212,191,.25)}
.input-row{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:rgba(9,32,50,.6)}
.input-row input{flex:1;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;padding:12px 16px;border-radius:999px;outline:none;transition:.2s}
.input-row input:focus{border-color:rgba(45,212,191,.6);background:rgba(255,255,255,.1)}
.input-row input::placeholder{color:#7d97aa;font-weight:600}
.send{width:46px;height:46px;border-radius:50%;flex:0 0 auto;border:0;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--teald));color:#03201c;display:grid;place-items:center;transition:.2s}
.send:hover{filter:brightness(1.1)}
.send svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
.note{padding:0 22px 16px;text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.note b{color:var(--teal)}
.mic,.speak{width:46px;height:46px;border-radius:50%;flex:0 0 auto;border:1px solid var(--line);cursor:pointer;display:grid;place-items:center;transition:.25s;background:rgba(255,255,255,.06);color:#bfe8fb}
.mic:hover,.speak:hover{background:rgba(255,255,255,.14);color:var(--ink)}
.mic svg,.speak svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mic.on{background:linear-gradient(135deg,#f43f5e,#be123c);color:#fff;border-color:rgba(255,255,255,.35);animation:ripple 1.4s infinite}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}70%{box-shadow:0 0 0 14px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}
.speak.on{background:linear-gradient(135deg,var(--teal),var(--teald));color:#03201c;border-color:transparent}
.voice-pill{align-self:center;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25);color:#cfe9f7;font-size:12.5px;font-weight:700;border-radius:999px;padding:7px 14px;animation:pop .25s ease both}
.voice-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--flame);animation:tp 1s infinite}
@media (max-width:520px){.msg{max-width:88%}.mic,.speak{width:40px;height:40px}.ava-ai{width:82px;height:92px}.chat-head{gap:10px}}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <span class="brand-name">MODERN GAS</span><span class="brand-chip">× AI</span>
      <span class="brand-sub-sm">المساعد الذكي — بيانات حقيقية من موقع الشركة</span>
    </div>
    <button class="clear" id="clearBtn">مسح المحادثة</button>
    <input id="apiUrl" class="api-url" type="text" placeholder="رابط الـ API (.Colab)" title="ضع رابط ngrok API هنا" />
    <input id="geminiKey" class="gk" type="password" placeholder="مفتاح Gemini AI (اختياري)" title="يُستخدم فقط لو فتحت الملف مباشرة بدون السيرفر" />
  </div>
  <div class="chat">
    <div class="chat-head">
      <div class="ava-ai" id="aiAvatar">
        <svg viewBox="0 0 140 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="روبوت مودرن جاز الذكي">
          <defs>
            <linearGradient id="headG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f7fdff"/><stop offset=".55" stop-color="#ddeff5"/><stop offset="1" stop-color="#bcdde7"/>
            </linearGradient>
            <radialGradient id="glowG" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="torsoG" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0e6a77"/><stop offset="1" stop-color="#0a3a50"/>
            </linearGradient>
          </defs>
          <circle class="glow" cx="70" cy="56" r="46" fill="url(#glowG)" opacity=".3"/>
          <g class="headg">
            <line x1="70" y1="26" x2="70" y2="9" stroke="#0e8f86" stroke-width="3" stroke-linecap="round"/>
            <circle class="ant" cx="70" cy="7" r="4" fill="#2dd4bf"/>
            <rect x="29" y="42" width="8" height="17" rx="4" fill="#0e8f86"/>
            <rect x="103" y="42" width="8" height="17" rx="4" fill="#0e8f86"/>
            <path d="M34 40 Q34 24 70 24 Q106 24 106 40 L106 74 Q106 92 70 92 Q34 92 34 74 Z" fill="url(#headG)" stroke="#0e8f86" stroke-width="2.5"/>
            <ellipse cx="54" cy="36" rx="14" ry="6" fill="#ffffff" opacity=".55"/>
            <path class="brow" d="M41 37 Q47 33 54 35" stroke="#0b3a4d" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <path class="brow" d="M86 35 Q93 33 99 37" stroke="#0b3a4d" stroke-width="2.6" stroke-linecap="round" fill="none"/>
            <g class="eye"><circle cx="50" cy="47" r="7.4" fill="#fff" stroke="#0b3a4d" stroke-width="2.4"/><circle cx="51" cy="48" r="3.2" fill="#0b3a4d"/><circle cx="49" cy="46" r="1.1" fill="#fff"/></g>
            <g class="eye"><circle cx="90" cy="47" r="7.4" fill="#fff" stroke="#0b3a4d" stroke-width="2.4"/><circle cx="91" cy="48" r="3.2" fill="#0b3a4d"/><circle cx="89" cy="46" r="1.1" fill="#fff"/></g>
            <ellipse cx="41" cy="59" rx="4.5" ry="3" fill="#fb923c" opacity=".3"/>
            <ellipse cx="99" cy="59" rx="4.5" ry="3" fill="#fb923c" opacity=".3"/>
            <path id="mth" d="M60 64 Q70 69 80 64" stroke="#0b3a4d" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          </g>
          <rect x="26" y="106" width="7" height="22" rx="3.5" fill="#0e8f86"/>
          <rect x="107" y="106" width="7" height="22" rx="3.5" fill="#0e8f86"/>
          <path d="M40 150 L47 102 Q49 94 70 94 Q91 94 93 102 L100 150 Z" fill="url(#torsoG)"/>
          <rect x="55" y="107" width="30" height="20" rx="5" fill="#061f2c" stroke="#2dd4bf" stroke-width="1.6"/>
          <text x="70" y="121" text-anchor="middle" font-size="8" font-weight="800" fill="#8ff5e6" font-family="Cairo">MG</text>
          <rect x="48" y="146" width="13" height="4" rx="2" fill="#06202d"/>
          <rect x="79" y="146" width="13" height="4" rx="2" fill="#06202d"/>
        </svg>
        <div class="thinking-bub"><span>.</span><span>.</span><span>.</span></div>
        <div class="wave"><i></i><i></i><i></i><i></i></div>
      </div>
      <div>
        <strong>Modern Gas · AI Assistant</strong>
        <span class="online" id="statusLine">متصل الآن — رد فوري</span>
      </div>
      <select id="voiceSel" class="voice-select" title="اختر صوت البوت">
        <option value="Charon">مصري رجالي — Shakir</option>
        <option value="Aoede">مصرية ست — Salma</option>
        <option value="Kore">مصرية ست — Salma (مطابقة)</option>
        <option value="google">جوجل (آلي ومباشر — للأداء السريع)</option>
      </select>
    </div>
    <div class="msg-area" id="msgArea"></div>
    <div class="chips" id="chips"></div>
    <div class="input-row">
      <button class="mic" id="micBtn" aria-label="تكلم بصوت" title="تكلم بالصوت">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
      </button>
      <input id="inp" type="text" placeholder="اسأل عن خدمات مودرن جاز: تعاقد، عداد، شحن، فواتير، سلامة..." autocomplete="off" />
      <button class="speak on" id="speakBtn" aria-label="كتم الرد الصوتي" title="الرد الصوتي">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button class="send" id="sendBtn" aria-label="إرسال">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="note"><b>مساعد شخصي لمودرن جاز</b> — ردوده على خدمات وإرشادات الشركة بس، من بيانات moderngas.com.eg الرسمية</div>
<script>
(() => {
  "use strict";
  /* ═══════════ أرقام خدمة العملاء لكل منطقة ═══════════
     ضع هنا الأرقام من صور موقع الشركة (CSENO01-05):
     القاهرة/القليوبية/الإسماعيلية / الشرقية / سوهاج/قنا / شمال وجنوب سيناء/مطروح */
  /* مفتايح المناطق مكتوبة بالشكل المفروض (ا/ي/ه) عشان تطابق الاستعلام المطبّع */
  const REGIONS = {
    "القاهره": null, "القليوبيه": null, "الاسماعيليه": null,
    "الشرقيه": null, "سوهاج": null, "قنا": null,
    "شمال سينا": null, "جنوب سينا": null, "سينا": null, "مطروح": null,
    "المنيا": null, "بني سويف": null, "اسيوط": null
  };
  const area = document.getElementById("msgArea");
  const inp = document.getElementById("inp");
  const sendBtn = document.getElementById("sendBtn");
  const chipsEl = document.getElementById("chips");
  const clearBtn = document.getElementById("clearBtn");
  const micBtn = document.getElementById("micBtn");
  const speakBtn = document.getElementById("speakBtn");
  const voiceSel = document.getElementById("voiceSel");
  const chatEl = document.querySelector(".chat");
  const statusLine = document.getElementById("statusLine");
  const mth = document.getElementById("mth");
  const defOnline = "متصل الآن — رد فوري";
  const apiUrlInput = document.getElementById("apiUrl");
  const geminiInput = document.getElementById("geminiKey");
  let API_URL = localStorage.getItem("mg_api_url") || "";
  let GEMINI_KEY = localStorage.getItem("mg_gemini_key") || "";
  let GEMINI_MODEL = "gemini-3.5-flash-lite";
  apiUrlInput.value = API_URL;
  geminiInput.value = GEMINI_KEY;
  apiUrlInput.addEventListener("change", function () {
    API_URL = this.value.replace(/\/+$/, "").trim();
    localStorage.setItem("mg_api_url", API_URL);
    status(API_URL ? "تم حفظ رابط الـ API: " + API_URL : "لم يُضبط رابط API — البوت يعمل بالمحرك المحلي");
  });
  geminiInput.addEventListener("change", function () {
    GEMINI_KEY = this.value.trim();
    localStorage.setItem("mg_gemini_key", GEMINI_KEY);
    status(GEMINI_KEY ? "مفتاح Gemini اتسجل — البوت بيرد بالذكاء الاصطناعي" : "مفتاح Gemini اتمسح");
  });
  const SYSTEM_PROMPT = "أنت مساعد «مودرن جاز» الذكي — المساعد الشخصي للشركة الحديثة للغاز الطبيعي (moderngas.com.eg). أجب بالعامية المصرية بلطف واحترافية، وكن مختصراً (3-6 سطور). ردودك على خدمات الشركة وإرشاداتها فقط." +
"\n\nعن الشركة: شركة مساهمة مصرية من قطاع البترول، تأسست في يوليو 2021 بدمج: غاز الأقاليم (2007) + القاهرة للغاز (2008) + سيناء للغاز (2009). رئيس مجلس الإدارة والعضو المنتدب: المهندس وائل جويد. النشاط: توصيل وتوزيع الغاز الطبيعي للمنازل والمحلات والمصانع، محطات تخفيض الضغط، محطات تموين السيارات بالغاز، توكيلات تجارية." +
"\n\nمناطق التغطية: القاهرة، القليوبية، الإسماعيلية، الشرقية، سوهاج، قنا، شمال وجنوب سيناء، مرسى مطروح." +
"\n\nالتعاقد: الطلب بالمستندات (إثبات شخصية + إثبات ملكية أو انتداب) من الفرع أو إدارة التعاقدات، ثم معاينة وتحديد التكلفة حسب النوع (سكني/تجاري/صناعي) والمنطقة، ثم تركيب الشبكة الداخلية والعداد وتسليم الإرشادات. التفاصيل في صفحة إجراءات التعاقد على الموقع الرسمي." +

    };
    fetch("/api/speak?text=" + encodeURIComponent(clean) + "&voice=" + encodeURIComponent(ttsVoice))
      .then(function (r) { if (!r.ok) throw new Error("tts"); return r.blob(); })
      .then(function (b) {
        if (myGen !== ttsGen) { release(); return; }
        ttsPendingBlobs++;
        release();
        playQueue.push({ seq: seq, blob: b, text: clean });
        ttsPumpPlay();
      })
      .catch(function () {
        if (myGen !== ttsGen) { release(); return; }
        release();
        playQueue.push({ seq: seq, text: clean });   /* Arc/Google fallback if Edge fails */
        ttsPumpPlay();
      });
  }
  function ttsPumpPlay() {
    if (playBusy || !playQueue.length) { if (!playQueue.length) setSpeaking(false); return; }
    /* شغّل القطعة اللي تسلسلها هو اللي جاي بالترتيب — مش أول واحدة
       وصلت، لأن القطع بتتولّد متوازية وواحدة ممكن توصل قبل اللي قبلها. */
    var item = null;
    for (var i = 0; i < playQueue.length; i++) {
      if (playQueue[i].seq === ttsPlayNext) { item = playQueue[i]; playQueue.splice(i, 1); break; }
    }
    if (!item) return;   /* القطعة الجاية لسه بتتولّد — استنى */
    playBusy = true;
    var myGen = ttsGen;
    var done = function () {
      playBusy = false;
      if (myGen !== ttsGen) { playQueue.length = 0; ttsPlayNext = 0; playBusy = false; setSpeaking(false); return; }
      ttsPlayNext++;
      ttsPumpPlay();
    };
    if (!item.blob) { fallbackSpeak(item.text, done); return; }
    var url = URL.createObjectURL(item.blob);
    var a = new Audio(url);
    audioEl = a;
    a.onplay = function () { setSpeaking(true); };
    a.onended = function () { URL.revokeObjectURL(url); done(); };
    a.onerror = function () { URL.revokeObjectURL(url); done(); };
    a.play().catch(function () { URL.revokeObjectURL(url); fallbackSpeak(item.text, done); });
  }
  function fallbackSpeak(text, done) {
    if (!("speechSynthesis" in window)) { if (done) done(); return; }
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(cleanForTTS(text));
    u.lang = "ar-EG";
    u.rate = 0.96;
    u.pitch = 1;
    var v = pickVoice();
    if (v) u.voice = v;
    var started = false;
    var guard = setTimeout(function () {
      if (!started) { if (done) done(); }
    }, 3000);
    u.onstart = function () { started = true; setSpeaking(true); };
    u.onend = function () { clearTimeout(guard); setSpeaking(false); if (done) done(); };
    u.onerror = function () { clearTimeout(guard); setSpeaking(false); if (done) done(); };
    speechSynthesis.speak(u);
  }
  /* ═══════ الصوت: الاستقبال (مايك) ═══════ */
  function sr() { return window.SpeechRecognition || window.webkitSpeechRecognition; }
  var rec = null;
  var listening = false;
  var pill = null;
  function pillShow(text) {
    if (pill) pill.remove();
    pill = document.createElement("div");
    pill.className = "voice-pill";
    var d = document.createElement("span");
    d.className = "dot";
    var t = document.createElement("span");
    t.textContent = text;
    pill.appendChild(d);
    pill.appendChild(t);
    area.appendChild(pill);
    scrollBottom();
  }
  function pillHide() { if (pill) { pill.remove(); pill = null; } }
  function startListening() {
    var C = sr();
    if (!C) { status("التعرف الصوتي مش متاح — استخدم Chrome أو Edge على ربط http/https"); return; }
    if (rec) { try { rec.abort(); } catch (e) {} }
    rec = new C();
    rec.lang = "ar-EG";
    rec.continuous = false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    listening = true;
    micBtn.classList.add("on");
    status("بيسمعك دلوقتي — اتكلم طبيعي...");
    pillShow("إنتا بتتكلم — كمل عادي");
    rec.onresult = function (ev) {
      var interim = "";
      var finalTxt = "";
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        if (r.isFinal) finalTxt += r[0].transcript; else interim += r[0].transcript;
      }
      inp.value = (finalTxt || interim).trim();
      status("بيسمعك دلوقتي — اتكلم طبيعي...");
    };
    rec.onend = function () {
      micBtn.classList.remove("on");
      pillHide();
      var was = listening;
      listening = false;
      if (was) { var val = (inp.value || "").trim(); if (val && !valTook(val)) handle(val); }
      if (statusLine.innerHTML.indexOf("بيسمعك") !== -1) status(defOnline);
    };
    rec.onerror = function (ev) {
      micBtn.classList.remove("on");
      pillHide();
      listening = false;
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        status("محتاج إذن المايك — اضغط أيقونة المايك جنب الرابط واسمح");
      } else if (ev.error === "no-speech") {
        status("مسمعتش صوت — اضغط المايك تاني واتكلم أعلى");
      } else if (ev.error === "audio-capture") {
        status("مفيش مايك متصل أو مقفول من ويندوز — افتحه واضغط المايك تاني");
      } else if (ev.error === "network") {
        status("مشاكل إنترنت — التعرف الصوتي محتاج اتصال");
      } else if (ev.error === "aborted") {
        status(defOnline);
      } else {
        status("مشكلة في التعرف (" + ev.error + ")");
      }
    };
    try { rec.start(); } catch (e) { status("فشل بدء المايك: " + e.message); }
  }
  var lastVocal = "";
  function valTook(v) { if (v === lastVocal) return true; lastVocal = v; return false; }
  function stopListening() {
    if (!listening) return;
    listening = false;
    micBtn.classList.remove("on");
    pillHide();
    status(defOnline);
    try { rec.stop(); rec = null; } catch (e) {}
  }
  sendBtn.addEventListener("click", function () { handle(inp.value); });
  inp.addEventListener("keydown", function (e) { if (e.key === "Enter") handle(inp.value); });
  micBtn.addEventListener("click", function () {
    if (!sr()) { status("التعرف الصوتي مش متاح هنا — جرّب متصفح Chrome"); return; }
    if (listening) { stopListening(); } else { startListening(); }
  });
  speakBtn.addEventListener("click", function () {
    voiceOn = !voiceOn;
    speakBtn.classList.toggle("on", voiceOn);
    speakBtn.setAttribute("aria-label", voiceOn ? "كتم الرد الصوتي" : "فعّل الرد الصوتي");
    status(voiceOn ? "الرد الصوتي شغال — البوت هيرد عليك بصوت" : "الرد الصوتي مكتوم — ردود نصية بس");
    if (!voiceOn) stopVoice();
  });
  clearBtn.addEventListener("click", function () {
    stopVoice();
    CONV = [];
    area.innerHTML = "";
    botBubble(R.greeting);
    renderChips();
    status(defOnline);
  });
  voiceSel.addEventListener("change", function () {
    voiceOn = true;
    speakBtn.classList.add("on");
    status("جارِ تشغيل عيّنة بهذا الصوت...");
    stopVoice();
    var sample = "أهلاً بيك في مودرن جاز! أنا مساعد مودرن جاز الذكي.";
    if (this.value === "google") {
      speak(sample);
      return;
    }
    /* الصوت الطبيعي بيتولّد في الخلفية أول مرة (بياخد شوية) */
    setTimeout(function () { speak(sample); }, 250);
  });
  area.innerHTML = "";
  botBubble(R.greeting);
  renderChips();
  stopLips();
  inp.focus();
  /* تسخين صوت الترحيب في الكاش — عشان أول رد بصوت فوري.
     نقسّمه جمل لأن Edge بطيء على النص الطويل. */
  if (window.location.protocol !== "file:") {
    setTimeout(function () {
      try {
        var parts = ttsChunks(cleanForTTS(R.greeting).slice(0, 900), 150);
        for (var i = 0; i < parts.length; i++) {
          fetch("/api/speak?text=" + encodeURIComponent(parts[i]) + "&voice=Charon").catch(function () {});
        }
      } catch (e) {}
    }, 1200);
  }
})();
</script>
